<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>大阪京都神戶奈良・旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E7;
    --paper:#FFFDF8;
    --paper-soft:#FBF6EC;
    --ink:#2B2622;
    --ink-soft:#726A5E;
    --ink-faint:#A79E8E;
    --line:rgba(43,38,34,.13);
    --indigo:#22405C;
    --indigo-deep:#152A3D;
    --indigo-soft:#DCE4E9;
    --vermillion:#BD4620;
    --vermillion-soft:#F3DDCF;
    --gold:#A9782B;
    --gold-soft:#F1E4C6;
    --plum:#6B4A73;
    --plum-soft:#E9DEE9;
    --jade:#4C7A5C;
    --jade-soft:#DCE9DF;
    --shadow: 0 1px 2px rgba(43,38,34,.06), 0 4px 14px rgba(43,38,34,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(189,70,32,.05), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(34,64,92,.05), transparent 45%);
    color:var(--ink);
    font-family:'Noto Sans TC', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif TC', serif;}
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit; color:inherit;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:30; flex:0 0 auto;
    background:var(--indigo);
    color:#F6F1E7;
    padding:14px 18px 12px;
    box-shadow:0 2px 10px rgba(21,42,61,.25);
    position:relative;
  }
  .topbar .made-by{
    font-size:10px; color:rgba(246,241,231,.38); letter-spacing:.02em; pointer-events:none;
  }
  .topbar .row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; max-width:640px; margin:0 auto;}
  .topbar .countdown-col{display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .topbar h1{margin:0; font-size:19px; font-weight:600; letter-spacing:.02em;}
  .topbar .dates{margin:2px 0 0; font-size:12px; color:#C9D6DE; letter-spacing:.02em;}
  .topbar .countdown{
    font-size:12px; white-space:nowrap; background:rgba(255,255,255,.12);
    padding:5px 10px; border-radius:20px; color:#F6F1E7; flex-shrink:0;
  }
  .topbar .countdown b{color:#F0B79A;}

  /* ---------- day chip row (itinerary only) ---------- */
  .daychips{
    position:sticky; top:64px; z-index:25;
    display:flex; align-items:center; gap:8px;
    flex:0 0 auto;
    overflow-x:auto; overflow-y:hidden;
    background:var(--paper-soft);
    padding:8px 14px; border-bottom:1px solid var(--line);
    scrollbar-width:none;
    height:58px; max-width:640px; margin:0 auto; box-sizing:border-box;
  }
  .daychips::-webkit-scrollbar{display:none;}
  .daychip{
    flex:0 0 auto; border:1px solid var(--line); background:var(--paper);
    border-radius:12px; padding:7px 12px; font-size:12.5px; color:var(--ink-soft);
    cursor:pointer; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2px; white-space:nowrap;
  }
  .daychip .d{font-family:'Noto Serif TC',serif; font-weight:600; font-size:13.5px; color:var(--ink); line-height:1.2;}
  .daychip .wd{line-height:1.2;}
  .daychip.active{background:var(--indigo); border-color:var(--indigo);}
  .daychip.active, .daychip.active .d, .daychip.active .wd{color:#fff;}
  .daychip.today{box-shadow:0 0 0 2px var(--vermillion) inset;}

  /* ---------- main ---------- */
  main{flex:1; padding:16px 14px 96px; max-width:640px; width:100%; margin:0 auto;}
  .section-title{
    font-family:'Noto Serif TC',serif; font-size:15px; font-weight:600;
    color:var(--ink); margin:22px 2px 10px; display:flex; align-items:center; justify-content:space-between;
  }
  .section-title .sum{font-family:'Noto Sans TC',sans-serif; font-weight:500; font-size:12px; color:var(--ink-soft);}
  .section-title:first-child{margin-top:2px;}

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow); position:relative;
  }
  .card.done{opacity:.55;}

  /* ---------- prep cards ---------- */
  .prep-top{display:flex; align-items:flex-start; gap:8px;}
  .prep-name{
    flex:1; border:none; background:transparent; font-size:15px; font-weight:600;
    color:var(--ink); padding:2px 0; min-width:0;
  }
  .status-tag{
    flex:0 0 auto; border-radius:7px; padding:5px 6px; font-size:12px;
    font-weight:700; white-space:nowrap; display:inline-flex; align-items:center;
    letter-spacing:.01em; margin-top:1px;
  }
  .status-select-inline{
    border:none; background:transparent; appearance:none; -webkit-appearance:none;
    -moz-appearance:none; font:inherit; font-weight:700; font-size:12px; cursor:pointer;
    padding:0 1px; color:inherit;
  }
  .status-select-inline:focus{outline:none;}
  .status-待處理{background:var(--paper-soft); color:var(--ink-faint); border:1px solid var(--line);}
  .status-處理中{background:var(--gold-soft); color:#7A5A18;}
  .status-處理完成{background:var(--jade-soft); color:#33553F;}
  .prep-meta-row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .amt-input{
    border:1px solid var(--line); border-radius:8px; background:var(--paper-soft);
    font-size:12.5px; padding:5px 8px; width:88px; color:var(--ink-soft);
  }
  .curr-select{
    border:1px solid var(--line); border-radius:8px; background:var(--paper-soft);
    font-size:12px; padding:5px 6px; color:var(--ink-soft);
  }
  .converted{font-size:11.5px; color:var(--vermillion); font-weight:600; align-self:center;}
  .rate-bar{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:var(--indigo-soft); color:var(--indigo); border-radius:12px;
    padding:9px 14px; margin-bottom:12px; font-size:12.5px; font-weight:600;
  }
  .rate-bar input{
    width:60px; border:1px solid var(--line); border-radius:7px; background:var(--paper);
    font-size:12.5px; padding:4px 6px; text-align:center; font-weight:700; color:var(--indigo);
  }
  .txt-input, .txt-area{
    width:100%; border:1px solid var(--line); border-radius:8px; background:var(--paper-soft);
    font-size:13px; padding:7px 9px; margin-top:8px; color:var(--ink);
  }
  .txt-area{resize:vertical; min-height:36px; line-height:1.45;}
  .field-label{font-size:10.5px; color:var(--ink-faint); margin:8px 0 3px 2px; letter-spacing:.03em;}
  .link-chip{
    display:inline-flex; align-items:center; gap:4px; margin-top:8px; font-size:12px;
    color:var(--indigo); background:var(--indigo-soft); padding:5px 10px; border-radius:8px;
    text-decoration:none; word-break:break-all;
  }
  .row-actions{display:flex; justify-content:flex-end; margin-top:8px;}
  .icon-btn{
    border:none; background:none; color:var(--ink-faint); font-size:12px; cursor:pointer;
    padding:4px 6px;
  }
  .icon-btn:hover{color:var(--vermillion);}
  .add-btn{
    display:block; width:100%; text-align:center; border:1.5px dashed var(--line);
    background:transparent; color:var(--ink-soft); border-radius:12px; padding:10px;
    font-size:13px; cursor:pointer; margin-top:4px;
  }
  .add-btn:hover{border-color:var(--indigo); color:var(--indigo);}

  /* ---------- itinerary cards ---------- */
  .day-summary{display:flex; justify-content:space-between; align-items:baseline; margin:14px 2px 10px;}
  .day-summary .dtitle{font-family:'Noto Serif TC',serif; font-weight:600; font-size:16px;}
  .day-summary .dcost{font-size:12px; color:var(--ink-soft);}
  .day-route{
    display:flex; flex-wrap:wrap; align-items:center; row-gap:6px; column-gap:7px;
    padding:14px 2px 0; font-size:13.5px; color:var(--ink); line-height:1.5;
  }
  .day-route .stop{font-weight:600;}
  .day-route .arrow{color:var(--vermillion); font-weight:700; font-size:12px;}
  .itin-card{display:flex; gap:10px;}
  .itin-time{flex:0 0 64px; text-align:right; padding-top:2px;}
  .itin-time input{
    width:64px; text-align:right; border:none; background:transparent; font-weight:700;
    font-size:14.5px; color:var(--indigo); font-family:'Noto Serif TC',serif; padding:0;
  }
  .itin-dur{margin-top:4px; display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .itin-dur select{
    border:none; background:var(--paper-soft); color:var(--ink-soft); font-size:12.5px;
    width:64px; padding:3px 2px; border-radius:6px; text-align:right; font-weight:500;
  }
  .itin-dur select.dur-last{color:var(--ink-faint); font-style:italic;}
  .itin-line{flex:0 0 auto; width:2px; background:var(--line); border-radius:2px; margin-top:4px;}
  .itin-body{flex:1; min-width:0;}
  .type-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .type-badge-select{
    border:none; border-radius:20px; padding:4px 22px 4px 10px; font-size:11.5px; font-weight:600;
    cursor:pointer; appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%23726A5E' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
    background-repeat:no-repeat; background-position:right 6px center; background-size:12px;
  }
  .type-交通{background-color:var(--indigo-soft); color:var(--indigo);}
  .type-景點{background-color:var(--vermillion-soft); color:var(--vermillion);}
  .type-飯店{background-color:var(--plum-soft); color:var(--plum);}
  .type-吃飯{background-color:var(--gold-soft); color:#7A5A18;}
  .type-空{background-color:var(--paper-soft); color:var(--ink-faint); border:1px solid var(--line);}
  .itin-last-note{font-size:11px; color:var(--ink-faint); margin-top:4px; text-align:right;}
  .done-toggle{
    margin-left:auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line);
    background:var(--paper); cursor:pointer; flex:0 0 auto; font-size:12px; line-height:1;
    display:flex; align-items:center; justify-content:center; color:transparent;
  }
  .done-toggle.on{background:var(--jade); border-color:var(--jade); color:#fff;}
  .itin-desc{
    width:100%; border:none; background:transparent; font-size:14.5px; font-weight:500;
    color:var(--ink); padding:0; line-height:1.5; resize:none; overflow:hidden;
  }
  .itin-sub{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;}
  .item-input{
    border:1px solid var(--line); background:var(--paper-soft); border-radius:8px;
    font-size:12px; padding:5px 8px; flex:1; min-width:88px; color:var(--ink-soft);
  }
  .status-select{
    border:1px solid var(--line); background:var(--paper-soft); border-radius:8px;
    font-size:12px; padding:5px 6px; color:var(--ink-soft);
  }
  .itin-note{margin-top:8px;}

  /* ---------- shopping ---------- */
  .filter-row{margin:2px 2px 10px;}
  .filter-label{
    display:block; font-family:'Noto Serif TC',serif; font-weight:600; font-size:12.5px;
    color:var(--ink-soft); margin-bottom:6px;
  }
  .who-tabs{display:flex; gap:8px; margin:0; flex-wrap:wrap;}
  .who-tab{
    border:1px solid var(--line); background:var(--paper); border-radius:20px;
    padding:6px 14px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .who-tab.active{background:var(--vermillion); border-color:var(--vermillion); color:#fff;}
  .who-tab.channel-tab.active{background:var(--indigo); border-color:var(--indigo);}
  .who-group-title{
    font-family:'Noto Serif TC',serif; font-weight:600; font-size:14.5px; margin:20px 2px 10px;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .who-group-title .gsub{font-family:'Noto Sans TC',sans-serif; font-weight:500; font-size:12px; color:var(--ink-soft);}
  .who-rename{
  font-family:'Noto Serif TC',serif; font-weight:600; font-size:14.5px; color:var(--ink);
  border:none; background:transparent; padding:1px 2px; margin:-1px -2px; border-radius:4px;
  min-width:1.5em;
}
.who-rename:hover, .who-rename:focus{background:var(--paper-soft); outline:none;}
  .channel-pills{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .channel-pill{
    border:1px solid var(--line); background:var(--paper-soft); border-radius:16px;
    padding:5px 11px; font-size:11.5px; color:var(--ink-soft); cursor:pointer;
  }
  .channel-pill.active{background:var(--indigo); border-color:var(--indigo); color:#fff;}
  .shop-card{display:flex; gap:12px;}
  .imgSlot{
    flex:0 0 116px; width:116px; height:230px; border-radius:10px; overflow:hidden;
    border:1px solid var(--line); background:var(--paper-soft); cursor:zoom-in; position:relative;
  }
  .imgSlot.active{border-color:var(--vermillion); border-style:solid; background:var(--vermillion-soft); color:var(--vermillion);}
  .imgSlot img{width:100%; height:100%; object-fit:contain;}
  .shop-body{flex:1; min-width:0;}
  .shop-top{display:flex; gap:8px; align-items:flex-start;}
  .shop-name{flex:1; width:100%; border:none; background:transparent; font-size:14.5px; font-weight:600; color:var(--ink); padding:1px 0; min-width:0;}
  .buy-toggle{
    flex:0 0 auto; width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line);
    background:var(--paper); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:transparent;
  }
  .buy-toggle.on{background:var(--jade); border-color:var(--jade); color:#fff;}
  .shop-variant{width:100%; border:none; background:transparent; font-size:12px; color:var(--ink-soft); padding:0; margin-top:2px;}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px;}
  .shop-grid label{font-size:9.5px; color:var(--ink-faint); display:block; margin-bottom:2px;}
  .shop-grid input{width:100%; border:1px solid var(--line); background:var(--paper-soft); border-radius:7px; font-size:12px; padding:5px 7px;}
  .imgActions{display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .mini-btn{border:1px solid var(--line); background:var(--paper-soft); color:var(--ink-soft); font-size:10.5px; padding:4px 9px; border-radius:7px; cursor:pointer; white-space:nowrap;}
  .paste-hint{font-size:10px; color:var(--vermillion); font-weight:600;}
  .total-bar{
    position:sticky; bottom:64px; z-index:20; background:var(--indigo-deep); color:#F6F1E7;
    padding:9px 16px; border-radius:12px; margin:10px 2px 4px; display:flex; justify-content:space-between;
    font-size:12.5px; box-shadow:var(--shadow);
  }
  .total-bar b{color:#F0B79A; font-size:14px; margin-left:4px;}


  /* ---------- money block (shared) ---------- */
  .price-field{
    display:flex; align-items:center; gap:5px; flex:1; min-width:0;
    border:1px solid var(--line); background:var(--paper); border-radius:9px; padding:0 10px; min-height:42px;
  }
  .price-field .cur-sym{font-size:12.5px; font-weight:700; color:var(--ink-faint); flex:0 0 auto;}
  .price-field input{width:100%; min-width:0; border:none; background:transparent; font-size:16px; font-weight:600; padding:0;}
  .qty-select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none; cursor:pointer;
    border:1px solid var(--line); background-color:var(--paper); border-radius:9px;
    padding:0 28px 0 12px; min-height:42px; font-size:15px; font-weight:600; color:var(--ink);
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%, calc(100% - 10px) 50%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  .channel-pill.add-chan{border-style:dashed; color:var(--indigo); background:transparent;}
  .who-tab.add-chan{border-style:dashed; color:var(--indigo);}

  .calc-line{display:flex; align-items:center; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .cur-chip{
    flex:0 0 auto; border:1px solid var(--indigo); background:var(--indigo); color:#fff;
    border-radius:9px; padding:0 10px; min-height:40px; font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.03em;
  }
  .cur-chip.ntd{background:var(--vermillion); border-color:var(--vermillion);}
  .calc-line .op{font-size:13px; color:var(--ink-faint); flex:0 0 auto;}
  .calc-line .price-field{flex:0 0 116px; min-width:0; min-height:40px; padding:0 8px;}
  .calc-line .price-field input{font-size:15px;}
  .calc-line .qty-select{
    flex:0 0 62px; min-height:40px; padding:0 22px 0 9px; font-size:14px;
    background-position:calc(100% - 12px) 50%, calc(100% - 8px) 50%;
  }
  .calc-sum{display:flex; align-items:baseline; gap:5px; flex:0 0 auto;}
  .calc-sum .sum-main{font-family:'Noto Serif TC',serif; font-size:18px; font-weight:700; color:var(--indigo-deep);}
  .calc-sum .sum-alt{font-size:11.5px; color:var(--ink-soft);}
  .mini-btn.on{background:var(--vermillion); border-color:var(--vermillion); color:#fff;}

  /* ---------- image viewer ---------- */
  .viewer-overlay{
    position:fixed; inset:0; z-index:60; background:rgba(21,42,61,.72);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .viewer-overlay.show{display:flex;}
  .viewer-box{background:var(--paper); border-radius:14px; padding:14px; width:100%; max-width:340px; box-shadow:var(--shadow);}
  .viewer-body{display:flex; justify-content:center;}
  .viewer-full{max-width:100%; max-height:58vh; border-radius:10px; display:block;}
  .crop-box{
    width:180px; height:220px; border-radius:10px; overflow:hidden;
    border:2px solid var(--vermillion); background:var(--paper-soft);
    touch-action:none; cursor:grab;
  }
  .crop-box img{width:100%; height:100%; object-fit:cover; pointer-events:none; user-select:none; -webkit-user-drag:none;}
  .viewer-hint{font-size:12px; color:var(--ink-soft); text-align:center; margin:10px 0 2px;}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; background:var(--paper); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0);
    box-shadow:0 -2px 14px rgba(43,38,34,.08);
  }
  .tabbar button{
    flex:1; border:none; background:none; padding:9px 4px 8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-faint);
  }
  .tabbar button .ic{font-size:19px;}
  .tabbar button span{font-size:10.5px; letter-spacing:.02em;}
  .tabbar button.active{color:var(--vermillion);}

  .empty-note{text-align:center; color:var(--ink-faint); font-size:12.5px; padding:30px 10px;}
  .storage-banner{
    position:sticky; top:64px; z-index:26; background:#F3DDCF; color:#7A3B1A;
    font-size:12px; padding:8px 14px; text-align:center; border-bottom:1px solid var(--line);
  }

  /* ---------- custom modal (replaces native confirm/prompt, which iframes can block) ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:100; background:rgba(21,20,18,.45);
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--paper); border-radius:16px; padding:20px; width:100%; max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .modal-msg{font-size:14.5px; color:var(--ink); line-height:1.5; margin-bottom:12px; font-weight:500;}
  .modal-input{
    display:none; width:100%; border:1px solid var(--line); border-radius:9px; background:var(--paper-soft);
    font-size:14px; padding:9px 11px; margin-bottom:14px; color:var(--ink);
  }
  .modal-input.show{display:block;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}
  .modal-btn{border:none; border-radius:9px; padding:8px 16px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .modal-btn-cancel{background:var(--paper-soft); color:var(--ink-soft); border:1px solid var(--line);}
  .modal-btn-ok{background:var(--vermillion); color:#fff;}
  @media (min-width:640px){ main{padding-left:0; padding-right:0;} }
</style>
</head>
<body>

<div class="topbar">
  <div class="row">
    <div>
      <h1 id="pageTitle">行前準備</h1>
      <p class="dates">🇯🇵 大阪・京都・神戶・奈良　8天7夜</p>
    </div>
    <div class="countdown-col">

/* ============ custom modal (confirm/prompt replacement) ============
   Artifact previews often run in a sandboxed iframe that silently blocks
   native confirm()/prompt() dialogs, so we roll our own tiny modal instead. */
function showModal({message, withInput=false, defaultValue='', placeholder='', okLabel='確定'}){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    const msgEl = document.getElementById('modalMsg');
    const inputEl = document.getElementById('modalInput');
    const okBtn = document.getElementById('modalOk');
    const cancelBtn = document.getElementById('modalCancel');

    msgEl.textContent = message;
    okBtn.textContent = okLabel;
    if(withInput){
      inputEl.classList.add('show');
      inputEl.value = defaultValue;
      inputEl.placeholder = placeholder;
    } else {
      inputEl.classList.remove('show');
    }
    overlay.classList.add('show');
    if(withInput) setTimeout(()=>inputEl.focus(), 30);

    function cleanup(result){
      overlay.classList.remove('show');
      okBtn.onclick = null; cancelBtn.onclick = null; overlay.onclick = null;
      inputEl.onkeydown = null;
      resolve(result);
    }
    okBtn.onclick = ()=> cleanup(withInput ? (inputEl.value || null) : true);
    cancelBtn.onclick = ()=> cleanup(withInput ? null : false);
    overlay.onclick = (e)=>{ if(e.target === overlay) cleanup(withInput ? null : false); };
    inputEl.onkeydown = (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); cleanup(inputEl.value || null); }
      if(e.key === 'Escape'){ e.preventDefault(); cleanup(null); }
    };
  });
}
function showConfirm(message){
  return showModal({message, withInput:false, okLabel:'刪除'});

/* ============ storage helpers (Firestore 版) ============ */
/* 若連線失敗，會顯示提示訊息，畫面仍可繼續編輯，但變更暫時不會保存。 */
let storageDisabled = false;
function storageOk(){
  return !storageDisabled;
}
function notifyStorageDisabled(){
  if(document.getElementById('storageBanner')) return;
  const b = document.createElement('div');
  b.id = 'storageBanner';
  b.className = 'storage-banner';
  b.textContent = '⚠️ 目前無法連線到雲端資料庫，畫面仍可繼續編輯，但這次的變更可能不會保存。請檢查網路後重新整理頁面。';
  document.body.insertBefore(b, document.body.firstChild.nextSibling);
}

/* 底層：對 Firestore 的 get / set / delete，每個 key 對應一份文件
   加上逾時保護：Firestore 若超過 20 秒沒回應（例如網路被防火牆擋住），
   就主動放棄、丟出錯誤，好讓上層可以改用預設資料繼續顯示畫面，
   而不會讓整個網頁一直卡在空白畫面。所有請求都是平行發出，不用排隊等待。 */
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('逾時：'+label+'（'+ms+'ms 內未回應）')), ms))
  ]);
}
async function fsGet(key){
  console.log('[雲端] 讀取', key, '...');
  const snap = await withTimeout(getDoc(doc(db, DATA_COLLECTION, key)), 20000, 'get '+key);
  console.log('[雲端] 讀取完成', key, snap.exists() ? '(有資料)' : '(沒有資料)');
  return snap.exists() ? snap.data() : null;
}
function fsSet(key, value){
  return withTimeout(setDoc(doc(db, DATA_COLLECTION, key), { value, updatedAt: Date.now() }), 20000, 'set '+key);
}
function fsDelete(key){
  return withTimeout(deleteDoc(doc(db, DATA_COLLECTION, key)), 20000, 'delete '+key);
}

async function loadKey(key, seed){
  if(!storageOk()) return JSON.parse(JSON.stringify(seed));
  try{
    const r = await fsGet(key);
    if(r && r.value) return JSON.parse(r.value);
    throw new Error('empty');
  }catch(e){
    try{ await fsSet(key, JSON.stringify(seed)); }catch(e2){ /* ignore, use seed in-memory */ }
    return JSON.parse(JSON.stringify(seed));
  }
}
function saveKey(key, val){
  if(!storageOk()) return;
  fsSet(key, JSON.stringify(val)).catch(err=>{ console.error('save fail', key, err); notifyStorageDisabled(); });
}
function deleteKey(key){
  if(!storageOk()) return;
  fsDelete(key).catch(()=>{});
}
function saveRaw(key, rawVal){
  if(!storageOk()) return;
  fsSet(key, rawVal).catch(err=>{ console.error('save fail', key, err); notifyStorageDisabled(); });
}
const saveDebounced = (()=>{
  let timers = {};
  return (key, getVal)=>{
    clearTimeout(timers[key]);
    timers[key] = setTimeout(()=> saveKey(key, getVal()), 450);
  };
})();

async function loadImage(id){
  if(!storageOk()) return;
  try{
    const r = await fsGet('img:'+id);
    if(r && r.value) shopImages[id] = r.value;
  }catch(e){ /* no image */ }
}

/* ============ init ============ */
async function init(){
  console.log('[初始化] 開始載入資料...');
  try{
    prepItems = await loadKey('prepItems', SEED_PREP);
    prepItems.forEach(migratePrepItem);
    const beforeLen = prepItems.length;
    prepItems = prepItems.filter(p => p.cat !== '行李準備');
    if(prepItems.length !== beforeLen) saveKey('prepItems', prepItems);
    luggageItems = await loadKey('luggageItems', SEED_LUGGAGE);
    itinItems = await loadKey('itinItems', SEED_ITIN);
    channelOptions = await loadKey('channelOptions', DEFAULT_CHANNELS);
    shopItems = await loadKey('shopItems', SEED_SHOP);
    shopItems.forEach(migrateShopItem);
    exchangeRate = await loadKey('exchangeRate', DEFAULT_RATE);
    await Promise.all(shopItems.map(s => loadImage(s.id)));
    console.log('[初始化] 資料載入完成');
  }catch(err){
    // never leave the page blank: fall back to seed data in-memory if loading failed
    console.error('[初始化] 資料載入失敗，改用預設資料顯示畫面：', err);
    if(!Array.isArray(prepItems) || !prepItems.length){
      prepItems = JSON.parse(JSON.stringify(SEED_PREP));
      prepItems.forEach(migratePrepItem);
      prepItems = prepItems.filter(p => p.cat !== '行李準備');
    }
    if(!Array.isArray(luggageItems) || !luggageItems.length) luggageItems = JSON.parse(JSON.stringify(SEED_LUGGAGE));
    if(!Array.isArray(itinItems) || !itinItems.length) itinItems = JSON.parse(JSON.stringify(SEED_ITIN));
    if(!Array.isArray(shopItems) || !shopItems.length) shopItems = JSON.parse(JSON.stringify(SEED_SHOP));
    shopItems.forEach(migrateShopItem);
    if(!exchangeRate) exchangeRate = DEFAULT_RATE;
  } finally {
    try{
      // default day: first day >= today, else 0
      const today = new Date(); today.setHours(0,0,0,0);
      const days = uniqueDays();
      let idx = days.findIndex(d => dayToDate(d) >= today);
      currentDayIndex = idx === -1 ? days.length - 1 : idx;

      renderCountdown();
      setInterval(renderCountdown, 60*1000);
      bindTabbar();
      bindGlobalPaste();
      bindImageViewer();
      render();
      console.log('[初始化] 畫面渲染完成');
    }catch(renderErr){
      console.error('[初始化] 渲染畫面時發生錯誤：', renderErr);
    }
  }
}
init();

/* ============ utils ============ */
function dayToDate(d){ // "2026/09/19" -> Date
  const [y,m,day] = d.split('/').map(Number);
  return new Date(y, m-1, day);
}
function uniqueDays(){
  const seen = []; const set = new Set();
  itinItems.forEach(i=>{ if(!set.has(i.date)){ set.add(i.date); seen.push(i.date);} });
  return seen;
}
const DEFAULT_CHANNELS = ['唐吉訶德','@cosme','大國藥妝','松本清','OS DRUG'];
let channelOptions = DEFAULT_CHANNELS.slice();
const QTY_MAX = 10;
function addChannelOption(name){
  const n = String(name || '').trim();
  if(!n) return null;
  if(!channelOptions.includes(n)){ channelOptions.push(n); saveKey('channelOptions', channelOptions); }
  return n;
}
function migrateShopItem(s){
  if(!Array.isArray(s.channels)){
    const raw = (s.channel || '').split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    s.channels = raw.filter(x => x && x.indexOf('其他') === -1);
    s.channelOther = raw.some(x => x.includes('其他'));
    if(s.channelOtherText === undefined) s.channelOtherText = '';
    delete s.channel;
  }
  s.channels.forEach(c => { if(c && !channelOptions.includes(c)) channelOptions.push(c); });
  if(s.currency === undefined || s.unitPrice === undefined){
    const q = Math.max(1, Math.round(parseAmount(s.qty)) || 1);
    const uJpy = parseAmount(s.unitJpy), uNtd = parseAmount(s.unitNtd);
    const tJpy = parseAmount(s.totalJpy), tNtd = parseAmount(s.totalNtd);
    if(uJpy > 0){ s.currency = 'jpy'; s.unitPrice = String(uJpy); }
    else if(uNtd > 0){ s.currency = 'ntd'; s.unitPrice = String(uNtd); }
    else if(tJpy > 0){ s.currency = 'jpy'; s.unitPrice = String(Math.round(tJpy / q)); }
    else if(tNtd > 0){ s.currency = 'ntd'; s.unitPrice = String(Math.round(tNtd / q)); }
    else { s.currency = 'jpy'; s.unitPrice = ''; }
    s.qty = String(q);
    delete s.unitNtd; delete s.unitJpy; delete s.totalNtd; delete s.totalJpy;
  }
}
function shopQty(s){ const n = Math.round(parseAmount(s.qty)); return n > 0 ? n : 1; }
function shopUnit(s){ return parseAmount(s.unitPrice); }
function shopTotals(s){
  const t = shopUnit(s) * shopQty(s);
  if(s.currency === 'jpy') return {jpy:t, ntd:t * exchangeRate};
  return {ntd:t, jpy: exchangeRate > 0 ? t / exchangeRate : 0};
}
function curSym(c){ return c === 'jpy' ? '¥' : 'NT$'; }
function qtyOptionsHtml(s){
  const q = shopQty(s); let out = '';
  for(let i = 1; i <= QTY_MAX; i++) out += '<option value="' + i + '"' + (i === q ? ' selected' : '') + '>' + i + '</option>';
  if(q > QTY_MAX) out += '<option value="' + q + '" selected>' + q + '</option>';
  return out + '<option value="__custom">自訂…</option>';
}
function itemMatchesChannelG(s){
  if(currentChannelFilter === '全部') return true;
  if(currentChannelFilter === '其他') return !!s.channelOther;
  return (s.channels || []).includes(currentChannelFilter);
}
function subtotalHtml(s){
  const t = shopTotals(s);
  const main = s.currency === 'jpy' ? fmtJPY(t.jpy) : fmtNTD(t.ntd);
  const alt  = s.currency === 'jpy' ? fmtNTD(t.ntd) : fmtJPY(t.jpy);
  return '<span class="sum-main">' + main + '</span><span class="sum-alt">(' + alt + ')</span>';
}
function sumPair(items){
  return items.reduce((a, it) => { const t = shopTotals(it); return {ntd:a.ntd + t.ntd, jpy:a.jpy + t.jpy}; }, {ntd:0, jpy:0});
}
function refreshShopTotals(){
  const view = document.getElementById('view');
  if(!view) return;
  view.querySelectorAll('[data-subtotal]').forEach(el => {
    const it = shopItems.find(s => s.id === el.dataset.subtotal);
    if(it) el.innerHTML = subtotalHtml(it);
  });
  view.querySelectorAll('[data-groupsub]').forEach(el => {
    const who = el.dataset.groupsub;
    const items = shopItems.filter(s => s.who === who && itemMatchesChannelG(s));
    const t = sumPair(items);
    el.textContent = items.length + ' 項・' + fmtNTD(t.ntd) + ' ／ ' + fmtJPY(t.jpy);
  });
  const g = view.querySelector('[data-grandtotal]');
  if(g){
    const items = shopItems.filter(s => (currentWhoFilter === '全部' || s.who === currentWhoFilter) && itemMatchesChannelG(s));
    const t = sumPair(items);
    g.innerHTML = '<b>' + fmtNTD(t.ntd) + '</b> ／ ' + fmtJPY(t.jpy);
  }
}
function migratePrepItem(p){
  if(p.amount === undefined){
    const jpyN = parseAmount(p.jpy);
    const ntdN = parseAmount(p.ntd);
    if(jpyN > 0){ p.currency = 'jpy'; p.amount = String(jpyN); }
    else { p.currency = 'ntd'; p.amount = String(ntdN); }
    delete p.jpy; delete p.ntd;
  }
  if(!p.currency) p.currency = 'ntd';
}
function prepItemNtd(p){
  const n = parseAmount(p.amount);
  return p.currency === 'jpy' ? n * exchangeRate : n;
}
function parseAmount(str){
  if(!str) return 0;
  const m = String(str).replace(/,/g,'').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : 0;
}
function fmtNTD(n){ return 'NT$' + Math.round(n).toLocaleString('en-US'); }
function fmtJPY(n){ return '¥' + Math.round(n).toLocaleString('en-US'); }
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function renderCountdown(){
  const el = document.getElementById('countdown');
  const today = new Date(); today.setHours(0,0,0,0);
  const msPerDay = 86400000;
  if(today < TRIP_START){
    const d = Math.round((TRIP_START - today)/msPerDay);
    el.innerHTML = `距離出發還有 <b>${d}</b> 天`;
  } else if(today <= TRIP_END){
    const d = Math.round((today - TRIP_START)/msPerDay) + 1;
    el.innerHTML = `旅程 第 <b>${d}</b> / 8 天`;
  } else {
    el.innerHTML = `旅程已結束 🎐`;
  }
}

function extractPlaceLabel(desc){
  if(!desc) return '';
  let s = desc.split('\n')[0].trim();
  const paren = s.match(/[（(]([^）)]+)[）)]/);
  const before = s.split(/[（(]/)[0].trim();
  // generic filler verbs carry no place info — prefer what's inside the parentheses instead
  const filler = /^(逛逛|晃晃|走走|吃飯|吃飯\+逛街|買|購物|休息)$/;
  let label = (filler.test(before) && paren) ? paren[1] : before;
  label = label.split(/[+＆&、\/／]/)[0].trim();
  return label;
}
function getDayRoute(date){
  if(DAY_ROUTE_OVERRIDE[date]) return DAY_ROUTE_OVERRIDE[date];
  const items = itinItems.filter(i=>i.date===date);
  let spots = items.filter(i=>i.type==='景點').map(i=>extractPlaceLabel(i.desc)).filter(Boolean);
  if(spots.length === 0){
    spots = items.filter(i=>i.type && i.type!=='交通' && i.type!=='飯店').map(i=>extractPlaceLabel(i.desc)).filter(Boolean);
  }
  const MAX = 6;
  if(spots.length > MAX){ spots = spots.slice(0, MAX); spots.push('…'); }
  return spots;
}

function renderDaychips(){
  const days = uniqueDays();
  const today = new Date(); today.setHours(0,0,0,0);
  const wrap = document.getElementById('daychips');
  wrap.innerHTML = days.map((d,i)=>{
    const dt = dayToDate(d);
    const isToday = dt.getTime() === today.getTime();
    const label = d.slice(5).replace('/','.');
    const wd = itinItems.find(it=>it.date===d)?.weekday || '';
    return `<div class="daychip ${i===currentDayIndex?'active':''} ${isToday?'today':''}" data-day="${i}">
      <span class="d">${label}</span><span class="wd">${wd}</span>
    </div>`;
  }).join('') + `<div class="daychip" data-adddayafter="last" style="border-style:dashed;">＋ 新增一天</div>`;

  wrap.querySelectorAll('[data-day]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      currentDayIndex = parseInt(chip.dataset.day);
      renderItin();
    });
  });
  const addDayBtn = wrap.querySelector('[data-adddayafter]');
  if(addDayBtn){
    addDayBtn.addEventListener('click', ()=>{
      const days2 = uniqueDays();
      const last = dayToDate(days2[days2.length-1]);
      last.setDate(last.getDate()+1);
      const y=last.getFullYear(), m=String(last.getMonth()+1).padStart(2,'0'), d=String(last.getDate()).padStart(2,'0');
      const newDate = `${y}/${m}/${d}`;
      const wdNames=['週日','週一','週二','週三','週四','週五','週六'];
      itinItems.push({id:newId('i'), date:newDate, weekday:wdNames[last.getDay()], time:'09:00', durH:'1小時', durM:'0分鐘', type:'', desc:'新行程', item:'', status:'', jpy:'', ntd:'', note:'', done:false});
      saveKey('itinItems', itinItems);
      currentDayIndex = uniqueDays().length - 1;
      renderItin();
    });
  }
}

function dayTotal(date){
  return itinItems.filter(i=>i.date===date).reduce((s,i)=>s+parseAmount(i.ntd),0);
}

function renderItin(){
  document.getElementById('daychips').style.display = 'flex';
  renderDaychips();
  const days = uniqueDays();
  const date = days[currentDayIndex];
  const view = document.getElementById('view');
  if(!date){ view.innerHTML = `<p class="empty-note">尚無行程，點上方「＋ 新增一天」開始規劃吧！</p>`; return; }

  const items = itinItems.filter(i=>i.date===date);
  const wd = items[0]?.weekday || '';

  let html = '';
  const route = getDayRoute(date);
  if(route.length){
    html += `<div class="day-route">${route.map((s,idx)=>
      (idx===0?'':'<span class="arrow">→</span>') + `<span class="stop">${escapeHtml(s)}</span>`
    ).join('')}</div>`;
  }
  html += `<div class="day-summary">
    <span class="dtitle">${date.replace(/^\d+\//,m=>m)} ${wd}</span>
    <span class="dcost">當日預估花費 ${fmtNTD(dayTotal(date))}</span>
  </div>`;
  items.forEach((i, idx) => html += itinCardHtml(i, idx === items.length - 1));
  html += `<button class="add-btn" data-additin>＋ 在這天新增行程</button>`;
  view.innerHTML = html;

  view.querySelector('[data-additin]').addEventListener('click', ()=>{
    itinItems.push({id:newId('i'), date, weekday:wd, time:'12:00', durH:'1小時', durM:'0分鐘', type:'', desc:'新行程項目', item:'', status:'', jpy:'', ntd:'', note:'', done:false});

  });

}

function bindItinCardEvents(scope){
  scope.querySelectorAll('.itin-card').forEach(card=>{
    const id = card.dataset.id;
    const item = itinItems.find(i=>i.id===id);
    if(!item) return;

    card.querySelectorAll('[data-field]').forEach(inp=>{
      if(inp.tagName==='TEXTAREA') autoGrow(inp);
      const evt = (inp.tagName==='SELECT') ? 'change' : 'input';
      inp.addEventListener(evt, ()=>{
        item[inp.dataset.field] = inp.value;
        if(inp.tagName==='TEXTAREA') autoGrow(inp);
        if(inp.dataset.field==='type'){
          saveKey('itinItems', itinItems);
          renderItin();
          return;
        }
        saveDebounced('itinItems', ()=>itinItems);
        if(inp.dataset.field==='ntd') renderDaychips(); // keep chips in sync (cheap)
      });
      if(inp.dataset.field==='ntd'){
        inp.addEventListener('blur', renderItin);
      }
    });

    card.querySelector('[data-toggledone]').addEventListener('click', ()=>{
      item.done = !item.done;
      saveKey('itinItems', itinItems);
      renderItin();
    });

    card.querySelectorAll('[data-move]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const dir = parseInt(btn.dataset.move);
        const dateItems = itinItems.filter(i=>i.date===item.date);
        const globalIdx = itinItems.indexOf(item);
        const posInDay = dateItems.indexOf(item);
        const swapWith = dateItems[posInDay+dir];
        if(!swapWith) return;
        const swapGlobalIdx = itinItems.indexOf(swapWith);
        [itinItems[globalIdx], itinItems[swapGlobalIdx]] = [itinItems[swapGlobalIdx], itinItems[globalIdx]];
        saveKey('itinItems', itinItems);
        renderItin();
      });
    });

    card.querySelector('[data-del]').addEventListener('click', async ()=>{
      const ok = await showConfirm('確定要刪除這個行程項目嗎？');
      if(!ok) return;
      itinItems = itinItems.filter(i=>i.id!==id);
      saveKey('itinItems', itinItems);
      renderItin();
    });
  });
}

  if(meIdx > 1){ whos.splice(meIdx,1); whos.splice(1,0,'我'); }

  const itemMatchesChannel = itemMatchesChannelG;

  let html = `<div class="rate-bar">
    <span>💱 匯率（與行前準備共用）</span>
    <span>¥1 = <input id="shopRateInput" type="number" step="0.001" min="0" value="${exchangeRate}"> NT$</span>
  </div>

    <span class="filter-label">訂購人</span>
    <div class="who-tabs">${whos.map(w=>
      `<div class="who-tab ${w===currentWhoFilter?'active':''}" data-who="${escapeHtml(w)}">${escapeHtml(w)}</div>`
    ).join('')}<div class="who-tab" data-addwho>＋ 新增訂購人</div></div>

    <span class="filter-label">購買通路</span>

      `<div class="who-tab channel-tab ${c===currentChannelFilter?'active':''}" data-channelfilter="${escapeHtml(c)}">${escapeHtml(c)}</div>`
    ).join('')}<div class="who-tab channel-tab add-chan" data-addchannel>＋ 通路</div></div>
  </div>`;

  const shown = currentWhoFilter==='全部' ? whos.filter(w=>w!=='全部') : [currentWhoFilter];
  let grandTotalNtd = 0, grandTotalJpy = 0;
  let anyShown = false;

  shown.forEach(who=>{
    const items = shopItems.filter(s=>s.who===who && itemMatchesChannel(s));
    if(items.length===0) return;
    anyShown = true;
    const sub = sumPair(items);
    grandTotalNtd += sub.ntd; grandTotalJpy += sub.jpy;
    html += `<div class="who-group-title"><input class="who-rename" data-oldwho="${escapeHtml(who)}" value="${escapeHtml(who)}" size="${Math.max(2, who.length)}"><span class="gsub" data-groupsub="${escapeHtml(who)}">${items.length} 項・${fmtNTD(sub.ntd)} ／ ${fmtJPY(sub.jpy)}</span></div>`;
    items.forEach(it => html += shopCardHtml(it));
    html += `<button class="add-btn" data-addshop="${escapeHtml(who)}">＋ 新增給「${escapeHtml(who)}」的代購項目</button>`;
  });

  if(!anyShown){
    html += `<p class="empty-note">這個篩選條件下沒有項目。</p>`;
  }

  html += `<div class="total-bar" style="position:static; margin-top:18px;">
    <span>${(currentWhoFilter==='全部' && currentChannelFilter==='全部') ? '代購總金額' : '目前篩選小計'}</span>
    <span data-grandtotal><b>${fmtNTD(grandTotalNtd)}</b> ／ ${fmtJPY(grandTotalJpy)}</span>
  </div>`;

  view.innerHTML = html;

  const rateInp = document.getElementById('shopRateInput');
  if(rateInp){
    rateInp.addEventListener('input', ()=>{
      exchangeRate = parseFloat(rateInp.value) || 0;
      saveDebounced('exchangeRate', ()=>exchangeRate);
      refreshShopTotals();
    });
    rateInp.addEventListener('blur', ()=>{ saveKey('exchangeRate', exchangeRate); refreshShopTotals(); });
  }
  const addChanBtn = view.querySelector('[data-addchannel]');
  if(addChanBtn) addChanBtn.addEventListener('click', async ()=>{
    const name = await showPrompt('新增購買通路：', '例如：Loft');
    const n = addChannelOption(name);
    if(!n) return;
    currentChannelFilter = n;
    renderShop();
  });

  view.querySelectorAll('[data-who]').forEach(tab=>{
    tab.addEventListener('click', ()=>{ currentWhoFilter = tab.dataset.who; renderShop(); });
  });
  view.querySelectorAll('[data-channelfilter]').forEach(tab=>{
    tab.addEventListener('click', ()=>{ currentChannelFilter = tab.dataset.channelfilter; renderShop(); });
  });
  const addWhoBtn = view.querySelector('[data-addwho]');
  if(addWhoBtn) addWhoBtn.addEventListener('click', async ()=>{
    const name = await showPrompt('新增訂購人姓名：', '例如：媽媽');
    if(!name) return;
    shopItems.push(blankShopItem(name));
    saveKey('shopItems', shopItems);
    currentWhoFilter = name;
    renderShop();
  });
    view.querySelectorAll('.who-rename').forEach(inp=>{
    inp.addEventListener('input', ()=>{ inp.size = Math.max(2, inp.value.length); });
    const commitRename = ()=>{
      const oldWho = inp.dataset.oldwho;
      const newWho = inp.value.trim();
      if(!newWho || newWho === oldWho){ inp.value = oldWho; inp.size = Math.max(2, oldWho.length); return; }
      shopItems.forEach(s => { if(s.who === oldWho) s.who = newWho; });
      saveKey('shopItems', shopItems);
      if(currentWhoFilter === oldWho) currentWhoFilter = newWho;
      renderShop();
    };
    inp.addEventListener('blur', commitRename);
    inp.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') inp.blur(); });
  });
  view.querySelectorAll('[data-addshop]').forEach(b=>{
    b.addEventListener('click', ()=>{
      shopItems.push(blankShopItem(b.dataset.addshop));
      saveKey('shopItems', shopItems);
      renderShop();
    });
  });

  bindShopCardEvents(view);
}

      };
      fi.click();
    });

    const removeBtn = card.querySelector('[data-removeimg]');
    if(removeBtn) removeBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      delete shopImages[id];
      deleteKey('img:'+id);
      renderShop();
    });

    card.querySelector('[data-del]').addEventListener('click', async ()=>{
      const ok = await showConfirm('確定要刪除這個代購項目嗎？');
      if(!ok) return;
      shopItems = shopItems.filter(s=>s.id!==id);
      delete shopImages[id];
      deleteKey('img:'+id);
      saveKey('shopItems', shopItems);
      renderShop();
    });
  });
}

/* 只等比例縮小檔案大小，不裁切內容，讓完整照片都能被存下來、之後完整顯示。 */
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 900;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleImageFile(id, file){
  try{
    const dataUrl = await compressImage(file);
    shopImages[id] = dataUrl;
    saveRaw('img:'+id, dataUrl);
    renderShop();
  }catch(e){ console.error('image compress fail', e); }
}

/* ---------- image viewer: zoom + reposition ---------- */
let viewerId = null, viewerAdjust = false, viewerPos = {x:50, y:50};
function parsePos(p){
  const m = String(p || '50% 50%').match(/(-?\d+(?:\.\d+)?)%\s+(-?\d+(?:\.\d+)?)%/);
  return m ? {x:parseFloat(m[1]), y:parseFloat(m[2])} : {x:50, y:50};
}
function openImageViewer(id){
  if(!shopImages[id]) return;
  viewerId = id; viewerAdjust = false;
  const it = shopItems.find(s=>s.id===id);
  viewerPos = parsePos(it && it.imgPos);
  renderViewer();
  document.getElementById('imgViewer').classList.add('show');
}
function closeImageViewer(){
  document.getElementById('imgViewer').classList.remove('show');
  viewerId = null; viewerAdjust = false;
}
function renderViewer(){
  const url = shopImages[viewerId];
  if(!url) return;
  const body = document.getElementById('imgViewerBody');
  const hint = document.getElementById('imgViewerHint');
  const acts = document.getElementById('imgViewerActions');
  if(!viewerAdjust){
    body.innerHTML = '<img class="viewer-full" src="' + url + '">';
    hint.textContent = '想換縮圖露出的部分，按「調整顯示範圍」';
    acts.innerHTML = '<button class="modal-btn modal-btn-cancel" data-vclose>關閉</button><button class="modal-btn modal-btn-ok" data-vadjust>調整顯示範圍</button>';
  } else {
    body.innerHTML = '<div class="crop-box" id="cropBox"><img src="' + url + '" style="object-position:' + viewerPos.x + '% ' + viewerPos.y + '%"></div>';
    hint.textContent = '在框內拖曳，移到你最想看清楚的部分';
    acts.innerHTML = '<button class="modal-btn modal-btn-cancel" data-vcancel>取消</button><button class="modal-btn modal-btn-ok" data-vsave>儲存</button>';
    bindCropDrag();
  }
}
function bindCropDrag(){
  const el = document.getElementById('cropBox');
  const img = el.querySelector('img');
  let sx = 0, sy = 0, px = 50, py = 50, dragging = false;
  el.addEventListener('pointerdown', e=>{
    dragging = true; el.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY; px = viewerPos.x; py = viewerPos.y;
    el.style.cursor = 'grabbing';
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const r = el.getBoundingClientRect();
    viewerPos.x = Math.max(0, Math.min(100, px - (e.clientX - sx) / r.width * 100));
    viewerPos.y = Math.max(0, Math.min(100, py - (e.clientY - sy) / r.height * 100));
    img.style.objectPosition = viewerPos.x + '% ' + viewerPos.y + '%';
  });
  const stop = ()=>{ dragging = false; el.style.cursor = 'grab'; };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
}
function bindImageViewer(){
  const ov = document.getElementById('imgViewer');
  ov.addEventListener('click', e=>{
    if(e.target === ov){ closeImageViewer(); return; }
    const btn = e.target.closest('button');
    if(!btn) return;
    if(btn.hasAttribute('data-vclose')) closeImageViewer();
    else if(btn.hasAttribute('data-vadjust')){ viewerAdjust = true; renderViewer(); }
    else if(btn.hasAttribute('data-vcancel')){
      const it = shopItems.find(s=>s.id===viewerId);
      viewerPos = parsePos(it && it.imgPos);
      viewerAdjust = false; renderViewer();
    }
    else if(btn.hasAttribute('data-vsave')){
      const it = shopItems.find(s=>s.id===viewerId);
      if(it){
        it.imgPos = Math.round(viewerPos.x) + '% ' + Math.round(viewerPos.y) + '%';
        saveKey('shopItems', shopItems);
      }
      closeImageViewer();
      renderShop();
    }
  });
}

function bindGlobalPaste(){
  document.addEventListener('paste', (e)=>{
    if(currentTab !== 'shop' || !activeImageTarget) return;
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(const it of items){
      if(it.type.indexOf('image') !== -1){
        const file = it.getAsFile();
        if(file) handleImageFile(activeImageTarget, file);
        e.preventDefault();
        break;
      }
    }
  });
}
